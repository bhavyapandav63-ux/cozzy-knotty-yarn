
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Cozzy Knotty Yarn</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #f7e9f8, #ead8f3, #fcecf2);
            font-family: Arial, sans-serif;
            color: #49334f;
        }

        .signup-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 38px 32px;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(83, 48, 91, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 25px;
            color: #754c83;
            margin-bottom: 8px;
        }

        .brand p {
            font-size: 13px;
            color: #9a829f;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e4d5e9;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #a779b5;
            box-shadow: 0 0 0 3px rgba(167, 121, 181, 0.12);
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #80538e;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .signup-btn:hover {
            background: #684078;
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
        }

        .login-link a {
            color: #80538e;
            font-weight: bold;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <div class="brand">
            <h1>COZZY KNOTTY YARN</h1>
            <p>Handmade gifts, made with love 🧶</p>
        </div>

        <h2>Create Your Account</h2>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Enter password again" required>
            </div>

            <button type="submit" class="signup-btn">Create Account</button>

            <p id="formMessage" class="message hidden"></p>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script>
        const signupForm = document.getElementById("signupForm");
        const formMessage = document.getElementById("formMessage");

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            formMessage.classList.remove("hidden");

            if (password.length < 8) {
                formMessage.textContent = "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                formMessage.textContent = "Passwords do not match.";
                return;
            }

            try {
                formMessage.textContent = "Creating your account...";

                const response = await fetch(
                    "http://localhost:5000/api/auth/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ name, email, password })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Registration failed.");
                }

                localStorage.setItem("authToken", data.token);
                localStorage.setItem("currentUser", JSON.stringify(data.user));

                formMessage.textContent = "Account created successfully! Redirecting...";

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);

            } catch (error) {
                formMessage.textContent = error.message || "Unable to connect to the server.";
            }
        });
    </script>

</body>
</html>
